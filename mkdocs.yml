site_name: APEX Hands-On Workshop
site_description: Hands-On Workshop to build a first APEX Application with a lot of components
site_url: https://raiwil.github.io/apex_workshop/
repo_url: https://github.com/raiwil/apex_workshop
repo_name: raiwil/apex_workshop

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
  #    toggle:
  #      icon: material/weather-night
  #      name: Dark mode
  #  - scheme: slate
  #    primary: deep orange
  #    accent: orange
  #    toggle:
  #      icon: material/weather-sunny
  #      name: Light mode

nav:
  - Start: index.md
  - Workshop Notes: workshop-notes.md
  - Chapters:
      - '1. Getting started': 01-getting-started.md
      - '2. Application Customization': 02-application-customization.md
      - '3. Authentication' : 03-authentication.md
      - '4. Authorization': 04-authorization.md
      - '5. Maps': 05-maps.md
      - '6. RESTful Services': 06-restful-services.md
      - '7. Reporting & Search': 07-reporting-and-search.md
      - '8. Charts': 08-charts.md
      - '9. Files & Images': 09-files-images.md
      - '10. Calendars': 10-calendars.md
      - '11. JavaScript': 11-javascript.md
      - '12. Layout': 12-layout.md
      - '13. Data Loading': 13-data-loading.md
      - '14. Approvals & Workflows': 14-approvals-workflows.md
      - '15. Translations': 15-translations.md  
      - '16. AI in APEX': 16-ai-in-apex.md
      - '17. More Development Features': 17-dev-features.md
      - '18. Operations & ALM': 18-ops-alm.md
      - '19. Links & Learning Resources': 19-links-learning-resources.md
      - '20. Updates over Joins': 20-updates-over-joins.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_name: APEX Hands-On Workshop
          nav_translations:
            Start: Start
            Workshop Notes: Workshop-Hinweise
            Chapters: Kapitel
            '1. Getting started': '1. Erste Schritte'
            '2. Application Customization': '2. Anwendung anpassen'
            '3. Authentication': '3. Authentifizierung'
            '4. Authorization': '4. Autorisierung'
            '5. Maps': '5. Landkarten'
            '6. RESTful Services': '6. RESTful Services'
            '7. Reporting & Search': '7. Reporting und Suche'
            '8. Charts': '8. Diagramme'
            '9. Files & Images': '9. Dateien und Bilder'
            '10. Calendars': '10. Kalender'
            '11. JavaScript': '11. JavaScript'
            '12. Layout': '12. Layout'
            '13. Data Loading': '13. Daten laden'
            '14. Approvals & Workflows': '14. Genehmigungen und Workflows'
            '15. Translations': '15. Übersetzungen'
            '16. AI in APEX': '16. KI in APEX'
            '17. More Development Features': '17. Weitere Entwicklungsfunktionen'
            '18. Operations & ALM': '18. Betrieb und ALM'
            '19. Links & Learning Resources': '19. Links und Lernressourcen'
            '20. Updates over Joins': '20. Updates über Joins'

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
