site_name: APEX Hands-On Workshop
site_description: Hands-On Workshop to build a first APEX Application with a lot of components
site_url: https://raiwil.github.io/apex_workshop/
repo_url: https://github.com/raiwil/apex_workshop
repo_name: raiwil/apex_workshop

theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
  #    toggle:
  #      icon: material/weather-night
  #      name: Dark mode
  #  - scheme: slate
  #    primary: deep orange
  #    accent: orange
  #    toggle:
  #      icon: material/weather-sunny
  #      name: Light mode

nav:
  - Start: index.md
  - Workshop Notes: workshop-notes.md
  - Chapters:
      - '1. Getting started': 01-getting-started.md
      - '2. Application Customization': 02-application-customization.md
      - '3. Authentication' : 03-authentication.md
      - '4. Authorization': 04-authorization.md
      - '5. Maps': 05-maps.md
      - '6. RESTful Services': 06-restful-services.md
      - '7. Reports': 07-reports.md
      - '8. Charts': 08-charts.md
      - '9. Files & Images': 09-files-images.md
      - '10. Calendars': 10-calendars.md
      - '11. JavaScript': 11-javascript.md
      - '12. Layout': 12-layout.md
      - '13. AI in APEX': 13-ai-in-apex.md
      - '14. Administration': 14-administration.md
      - '15. Application Lifecycle Management': 15-application-lifecycle-management.md
      - '16. Translations': 16-translations.md
      - '17. Data Loading': 17-data-loading.md
      - '18. Approvals & Workflows': 18-approvals-workflows.md
      - '19. Mobile Applications': 19-mobile-applications.md
      - '20. Forms - Updates over Joins': 20-forms.md
      - '21. Miscellaneous': 21-miscellaneous.md
      - '22. Links & Learning Resources': 22-links-learning-resources.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
